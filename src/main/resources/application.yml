# 默认配置：本地开发使用 H2 文件数据库（无需安装任何数据库）
spring:
  datasource:
    url: jdbc:h2:file:./data/smartspend;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      enabled: false
  web:
    resources:
      cache:
        cachecontrol:
          # 静态资源每次请求都回源校验（内容未变时返回 304），避免浏览器缓存旧版 JS/CSS
          no-cache: true

server:
  # Railway 等云平台通过 PORT 环境变量指定端口，本地默认 8080
  port: ${PORT:8080}

# AI 分析配置（固定使用豆包，API Key 优先从环境变量 DOUBAO_API_KEY 读取）
app:
  ai:
    default-api-key: ${DOUBAO_API_KEY:}

---
# Railway 部署配置：设置环境变量 SPRING_PROFILES_ACTIVE=mysql 并关联 MySQL 服务即可
# Railway 的 MySQL 服务会自动注入 MYSQLHOST/MYSQLPORT/MYSQLUSER/MYSQLPASSWORD/MYSQLDATABASE 环境变量
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:smartspend}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
